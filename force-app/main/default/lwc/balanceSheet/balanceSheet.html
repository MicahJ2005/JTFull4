<template>
    <lightning-card>
        <div class="slds-p-around_medium">
            
            <div class="slds-text-align_center slds-m-bottom_medium">
                <h2 style="color: var(--brand-primary); font-size: 1.5rem; display: inline-block; vertical-align: middle;">Balance Sheet</h2>
                <lightning-button-icon icon-name="utility:refresh" variant="bare" size="medium" onclick={handleRefresh} class="slds-m-left_small" title="Refresh Data" style="vertical-align: middle;"></lightning-button-icon>
                <p class="slds-text-color_weak">{currentDate}</p>
            </div>

            <template if:true={showSaveButton}>
                <div class="save-bar">
                    <span class="unsaved-text">Unsaved changes</span>
                    <lightning-button variant="brand" label="Save Changes" onclick={handleSaveChanges} disabled={isSaving}></lightning-button>
                </div>
            </template>

            <div class="top-scrollbar-container" onscroll={handleScrollTop}>
                <div class="dummy-scrollbar-content"></div>
            </div>

            <div class="data-scroll-container" onscroll={handleScrollData}>
                
                <div class="sheet-content-wrapper">
                    
                    <div class="section-wrapper">
                        <div class="sheet-grid header-row main-sticky-header">
                            <div class="header-cell left">ASSET / DESCRIPTION</div>
                            <div class="header-cell center">DATE</div>
                            <div class="header-cell">VALUE</div>
                            <div class="header-cell">TOTAL DEBT</div>
                            <div class="header-cell" title={clientNonMarHeader}>{clientNonMarHeader}</div>
                            <div class="header-cell" title={opposingNonMarHeader}>{opposingNonMarHeader}</div>
                            <div class="header-cell" style="background: rgba(0,0,0,0.1);">NET VALUE</div>
                            <div class="header-cell" title={clientName}>{clientName} Award</div>
                            <div class="header-cell" title={opposingName}>{opposingName} Award</div>
                            <div class="header-cell"></div>
                        </div>

                        <div class="section-title">
                            <span>Real Estate</span>
                            <lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddRealEstate}></lightning-button-icon>
                        </div>
                        <template for:each={realEstateAssets} for:item="asset">
                            <div key={asset.id} class="sheet-grid data-row">
                                <div if:true={asset.isSaved}><a href={asset.recordUrl} target="_blank" class="record-link">{asset.name}</a></div>
                                <div if:false={asset.isSaved}><input type="text" class="excel-input text-left" value={asset.name} data-id={asset.id} data-type="realEstate" data-field="name" onchange={handleAssetChange} placeholder="New Property"/></div>
                                <div></div> 
                                <div class="result-cell">{asset.formattedValue}</div>
                                <div class="text-cell">{asset.formattedDebt1}</div>
                                <div class="text-cell">{asset.clientNonMarital}</div>
                                <div class="text-cell">{asset.opposingNonMarital}</div>
                                <div class={asset.netValueClass} style="background: #f8fbff;">{asset.formattedNetValue}</div>
                                <div class="text-cell">{asset.clientMarital}</div>
                                <div class="text-cell">{asset.opposingMarital}</div>
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={asset.id} data-type="realEstate" onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>

                        <div class="section-title"><span>Bank Accounts</span><lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddBankAccount}></lightning-button-icon></div>
                        <template for:each={bankAccounts} for:item="asset">
                            <div key={asset.id} class="sheet-grid data-row">
                                <div if:true={asset.isSaved}><a href={asset.recordUrl} target="_blank" class="record-link">{asset.name}</a></div>
                                <div if:false={asset.isSaved}><input type="text" class="excel-input text-left" value={asset.name} data-id={asset.id} data-type="bankAccount" data-field="name" onchange={handleAssetChange} placeholder="New Account"/></div>
                                <div class={asset.dateClass}><lightning-input type="date" variant="label-hidden" value={asset.valueDate} data-id={asset.id} data-type="bankAccount" data-field="valueDate" onchange={handleAssetChange} class="modern-date-input"></lightning-input></div>
                                <div><input type="number" class="excel-input" value={asset.value} data-id={asset.id} data-type="bankAccount" data-field="value" onchange={handleAssetChange} step="0.01"/></div>
                                <div><input type="number" class="excel-input" value={asset.debt1} data-id={asset.id} data-type="bankAccount" data-field="debt1" onchange={handleAssetChange} step="0.01"/></div>
                                <div class="text-cell">{asset.clientNonMarital}</div><div class="text-cell">{asset.opposingNonMarital}</div><div class={asset.netValueClass} style="background: #f8fbff;">{asset.formattedNetValue}</div><div class="text-cell">{asset.clientMarital}</div><div class="text-cell">{asset.opposingMarital}</div>
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={asset.id} data-type="bankAccount" onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>

                        <div class="section-title"><span>Business</span><lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddBusiness}></lightning-button-icon></div>
                        <template for:each={businesses} for:item="asset">
                            <div key={asset.id} class="sheet-grid data-row">
                                <div if:true={asset.isSaved}><a href={asset.recordUrl} target="_blank" class="record-link">{asset.name}</a></div>
                                <div if:false={asset.isSaved}><input type="text" class="excel-input text-left" value={asset.name} data-id={asset.id} data-type="business" data-field="name" onchange={handleAssetChange} placeholder="New Business"/></div>
                                <div class={asset.dateClass}><lightning-input type="date" variant="label-hidden" value={asset.valueDate} data-id={asset.id} data-type="business" data-field="valueDate" onchange={handleAssetChange} class="modern-date-input"></lightning-input></div>
                                <div><input type="number" class="excel-input" value={asset.value} data-id={asset.id} data-type="business" data-field="value" onchange={handleAssetChange} step="0.01"/></div>
                                <div><input type="number" class="excel-input" value={asset.debt1} data-id={asset.id} data-type="business" data-field="debt1" onchange={handleAssetChange} step="0.01"/></div>
                                <div class="text-cell">{asset.clientNonMarital}</div><div class="text-cell">{asset.opposingNonMarital}</div><div class={asset.netValueClass} style="background: #f8fbff;">{asset.formattedNetValue}</div><div class="text-cell">{asset.clientMarital}</div><div class="text-cell">{asset.opposingMarital}</div>
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={asset.id} data-type="business" onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>

                        <div class="section-title"><span>Stocks</span><lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddStock}></lightning-button-icon></div>
                        <template for:each={stocks} for:item="asset">
                            <div key={asset.id} class="sheet-grid data-row">
                                <div if:true={asset.isSaved}><a href={asset.recordUrl} target="_blank" class="record-link">{asset.name}</a></div>
                                <div if:false={asset.isSaved}><input type="text" class="excel-input text-left" value={asset.name} data-id={asset.id} data-type="stock" data-field="name" onchange={handleAssetChange} placeholder="New Stock"/></div>
                                <div class={asset.dateClass}><lightning-input type="date" variant="label-hidden" value={asset.valueDate} data-id={asset.id} data-type="stock" data-field="valueDate" onchange={handleAssetChange} class="modern-date-input"></lightning-input></div>
                                <div class="result-cell">{asset.formattedValue}</div>
                                <div class="result-cell">{asset.formattedDebt1}</div>
                                <div class="text-cell">{asset.clientNonMarital}</div><div class="text-cell">{asset.opposingNonMarital}</div><div class={asset.netValueClass} style="background: #f8fbff;">{asset.formattedNetValue}</div><div class="text-cell">{asset.clientMarital}</div><div class="text-cell">{asset.opposingMarital}</div>
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={asset.id} data-type="stock" onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>

                        <div class="section-title"><span>Vehicles</span><lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddVehicle}></lightning-button-icon></div>
                        <template for:each={vehicles} for:item="asset">
                            <div key={asset.id} class="sheet-grid data-row">
                                <div if:true={asset.isSaved}><a href={asset.recordUrl} target="_blank" class="record-link">{asset.name}</a></div>
                                <div if:false={asset.isSaved}><input type="text" class="excel-input text-left" value={asset.name} data-id={asset.id} data-type="vehicle" data-field="name" onchange={handleAssetChange} placeholder="New Vehicle"/></div>
                                <div class={asset.dateClass}><lightning-input type="date" variant="label-hidden" value={asset.valueDate} data-id={asset.id} data-type="vehicle" data-field="valueDate" onchange={handleAssetChange} class="modern-date-input"></lightning-input></div>
                                <div><input type="number" class="excel-input" value={asset.value} data-id={asset.id} data-type="vehicle" data-field="value" onchange={handleAssetChange} step="0.01"/></div>
                                <div><input type="number" class="excel-input" value={asset.debt1} data-id={asset.id} data-type="vehicle" data-field="debt1" onchange={handleAssetChange} step="0.01"/></div>
                                <div class="text-cell">{asset.clientNonMarital}</div><div class="text-cell">{asset.opposingNonMarital}</div><div class={asset.netValueClass} style="background: #f8fbff;">{asset.formattedNetValue}</div><div class="text-cell">{asset.clientMarital}</div><div class="text-cell">{asset.opposingMarital}</div>
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={asset.id} data-type="vehicle" onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>

                        <div class="section-title"><span>Life Insurance</span><lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddLifeInsurance}></lightning-button-icon></div>
                        <template for:each={lifeInsurance} for:item="asset">
                            <div key={asset.id} class="sheet-grid data-row">
                                <div if:true={asset.isSaved}><a href={asset.recordUrl} target="_blank" class="record-link">{asset.name}</a></div>
                                <div if:false={asset.isSaved}><input type="text" class="excel-input text-left" value={asset.name} data-id={asset.id} data-type="lifeInsurance" data-field="name" onchange={handleAssetChange} placeholder="New Policy"/></div>
                                <div class={asset.dateClass}><lightning-input type="date" variant="label-hidden" value={asset.valueDate} data-id={asset.id} data-type="lifeInsurance" data-field="valueDate" onchange={handleAssetChange} class="modern-date-input"></lightning-input></div>
                                <div><input type="number" class="excel-input" value={asset.value} data-id={asset.id} data-type="lifeInsurance" data-field="value" onchange={handleAssetChange} step="0.01"/></div>
                                <div><input type="number" class="excel-input" value={asset.debt1} data-id={asset.id} data-type="lifeInsurance" data-field="debt1" onchange={handleAssetChange} step="0.01"/></div>
                                <div class="text-cell">{asset.clientNonMarital}</div><div class="text-cell">{asset.opposingNonMarital}</div><div class={asset.netValueClass} style="background: #f8fbff;">{asset.formattedNetValue}</div><div class="text-cell">{asset.clientMarital}</div><div class="text-cell">{asset.opposingMarital}</div>
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={asset.id} data-type="lifeInsurance" onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>

                        <div class="sheet-grid subtotal-row" style="min-width: 100%; width: fit-content;"><div style="grid-column: span 6; padding-left: 0.5rem;">TOTAL ASSETS (Excluding Retirement)</div><div class="result-cell">{formattedAssetsNetValue}</div><div class="result-cell">{formattedAssetsClient}</div><div class="result-cell">{formattedAssetsOpposing}</div><div></div></div>
                    </div>
                    
                    <div class="section-wrapper slds-m-top_large">
                        <div class="sheet-grid header-row">
                            <div class="header-cell left">DEBT NAME</div>
                            <div class="header-cell center">DATE</div>
                            <div class="header-cell">BALANCE</div>
                            <div class="header-cell"></div>
                            <div class="header-cell" title={clientNonMarHeader}>{clientNonMarHeader}</div>
                            <div class="header-cell" title={opposingNonMarHeader}>{opposingNonMarHeader}</div>
                            <div class="header-cell" style="background: rgba(0,0,0,0.1);">NET VALUE</div>
                            <div class="header-cell" title={clientName}>{clientName} Award</div>
                            <div class="header-cell" title={opposingName}>{opposingName} Award</div>
                            <div class="header-cell"></div>
                        </div>
                        
                        <div class="section-title"><span>Debts</span><lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddDebt}></lightning-button-icon></div>
                        <template for:each={debts} for:item="debt">
                            <div key={debt.id} class="sheet-grid data-row">
                                <div if:true={debt.isSaved}><a href={debt.recordUrl} target="_blank" class="record-link">{debt.name}</a></div>
                                <div if:false={debt.isSaved}><input type="text" class="excel-input text-left" value={debt.name} data-id={debt.id} data-field="name" onchange={handleDebtChange} placeholder="New Debt"/></div>
                                <div class={debt.dateClass}><lightning-input type="date" variant="label-hidden" value={debt.valueDate} data-id={debt.id} data-field="valueDate" onchange={handleDebtChange} class="modern-date-input"></lightning-input></div>
                                <div><input type="number" class="excel-input" value={debt.balance} data-id={debt.id} data-field="balance" onchange={handleDebtChange} step="0.01"/></div><div></div> 
                                <div class="text-cell">{debt.clientNonMarital}</div><div class="text-cell">{debt.opposingNonMarital}</div><div class={debt.netValueClass} style="background: #f8fbff;">{debt.formattedNetValue}</div><div class="text-cell">{debt.clientMarital}</div><div class="text-cell">{debt.opposingMarital}</div>
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={debt.id} data-type="debt" onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>
                        <div class="sheet-grid subtotal-row" style="min-width: 100%; width: fit-content;"><div style="grid-column: span 6; padding-left: 0.5rem;">TOTAL DEBTS</div><div class="result-cell">{formattedDebtsNetValue}</div><div class="result-cell">{formattedDebtsClient}</div><div class="result-cell">{formattedDebtsOpposing}</div><div></div></div>
                    </div>
                    
                    <div class="section-wrapper slds-m-top_large">
                        <div class="sheet-grid header-row" style="background-color: #5b7f94;">
                            <div class="header-cell left">DESCRIPTION</div>
                            <div class="header-cell center" style="grid-column: span 2;">PAYOR</div>
                            <div class="header-cell">AMOUNT</div>
                            <div class="header-cell"></div>
                            <div class="header-cell"></div>
                            <div class="header-cell" style="background: rgba(0,0,0,0.1);">NET ADJUSTMENT</div>
                            <div class="header-cell" title={clientName}>{clientName} Impact</div>
                            <div class="header-cell" title={opposingName}>{opposingName} Impact</div>
                            <div class="header-cell"></div>
                        </div>

                        <div class="section-title"><span>Cash Settlements</span><lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddPleading}></lightning-button-icon></div>
                        <template for:each={pleadings} for:item="pl">
                            <div key={pl.id} class="sheet-grid data-row">
                                <div if:true={pl.isSaved}><a href={pl.recordUrl} target="_blank" class="record-link">{pl.name}</a></div>
                                <div if:false={pl.isSaved}><input type="text" class="excel-input text-left" value={pl.name} data-id={pl.id} data-type="pleading" data-field="name" onchange={handlePleadingChange} placeholder="Settlement desc"/></div>
                                
                                <div style="grid-column: span 2; padding: 2px;">
                                    <select class="excel-input" data-id={pl.id} data-type="pleading" data-field="payor" onchange={handlePleadingChange}>
                                        <option value="" selected={pl.isNoSelection}>Select Payor...</option>
                                        <option value="Client Pays" selected={pl.isClientPays}>Client Pays</option>
                                        <option value="Opposing Pays" selected={pl.isOpposingPays}>Opposing Pays</option>
                                    </select>
                                </div>

                                <div><input type="number" class="excel-input" value={pl.amount} data-id={pl.id} data-type="pleading" data-field="amount" onchange={handlePleadingChange} step="0.01"/></div>
                                
                                <div></div><div></div>

                                <div class="result-cell">{pl.formattedAmount}</div>
                                
                                <div class={pl.clientClass}>{pl.formattedClientImpact}</div>
                                <div class={pl.opposingClass}>{pl.formattedOpposingImpact}</div>
                                
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={pl.id} data-type="pleading" onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>
                        <div class="sheet-grid subtotal-row" style="min-width: 100%; width: fit-content;">
                            <div style="grid-column: span 6; padding-left: 0.5rem;">TOTAL SETTLEMENTS</div>
                            <div class="result-cell">-</div>
                            <div class="result-cell">{formattedPleadingsClient}</div>
                            <div class="result-cell">{formattedPleadingsOpposing}</div>
                            <div></div>
                        </div>
                    </div>

                    <div class="section-wrapper slds-m-top_large">
                        <div class="sheet-grid header-row" style="background-color: #5b7f94;">
                            <div class="header-cell left">RETIREMENT ASSET</div>
                            <div class="header-cell center">DATE</div>
                            <div class="header-cell">VALUE</div>
                            <div class="header-cell">LOAN/DEBT</div>
                            <div class="header-cell" title={clientNonMarHeader}>{clientNonMarHeader}</div>
                            <div class="header-cell" title={opposingNonMarHeader}>{opposingNonMarHeader}</div>
                            <div class="header-cell" style="background: rgba(0,0,0,0.1);">NET VALUE</div>
                            <div class="header-cell" title={clientName}>{clientName} Award</div>
                            <div class="header-cell" title={opposingName}>{opposingName} Award</div>
                            <div class="header-cell"></div>
                        </div>
                        
                        <div class="section-title"><span>Retirement</span><lightning-button-icon icon-name="utility:add" variant="bare" size="medium" onclick={handleAddRetirement}></lightning-button-icon></div>
                        <template for:each={retirementAccounts} for:item="ret">
                            <div key={ret.id} class="sheet-grid data-row">
                                <div if:true={ret.isSaved}><a href={ret.recordUrl} target="_blank" class="record-link">{ret.name}</a></div>
                                <div if:false={ret.isSaved}><input type="text" class="excel-input text-left" value={ret.name} data-id={ret.id} data-field="name" onchange={handleRetirementChange} placeholder="New Retirement Acct"/></div>
                                <div class={ret.dateClass}><lightning-input type="date" variant="label-hidden" value={ret.valueDate} data-id={ret.id} data-field="valueDate" onchange={handleRetirementChange} class="modern-date-input"></lightning-input></div>
                                <div><input type="number" class="excel-input" value={ret.value} data-id={ret.id} data-field="value" onchange={handleRetirementChange} step="0.01"/></div>
                                <div><input type="number" class="excel-input" value={ret.debt} data-id={ret.id} data-field="debt" onchange={handleRetirementChange} step="0.01"/></div>
                                <div class="text-cell">{ret.clientNonMarital}</div><div class="text-cell">{ret.opposingNonMarital}</div><div class={ret.netValueClass} style="background: #f8fbff;">{ret.formattedNetValue}</div><div class="text-cell">{ret.clientMarital}</div><div class="text-cell">{ret.opposingMarital}</div>
                                <div class="action-col"><lightning-button-icon icon-name="utility:delete" variant="bare" class="slds-text-color_error" data-id={ret.id} onclick={handleRequestDelete}></lightning-button-icon></div>
                            </div>
                        </template>
                        <div class="sheet-grid subtotal-row" style="min-width: 100%; width: fit-content;"><div style="grid-column: span 6; padding-left: 0.5rem;">TOTAL RETIREMENT</div><div class="result-cell">{formattedRetirementNetValue}</div><div class="result-cell">{formattedRetirementClient}</div><div class="result-cell">{formattedRetirementOpposing}</div><div></div></div>
                    </div>
                </div> 
            </div> 

            <div class="total-section">
                <div>
                    <div class="slds-text-heading_small slds-m-bottom_medium slds-text-align_center">
                        <strong>Equalization Summary (Non-Retirement)</strong>
                    </div>
                    <div class="summary-row"><span class="summary-label">Net Total (Assets + Debts):</span><span class="summary-value">{formattedNetTotal}</span></div>
                    <div class="summary-row"><span class="summary-label">Each Party Entitled To (50%):</span><span class="summary-value">{formattedEachPartyEntitled}</span></div>
                    
                    <div class="slds-grid slds-gutters slds-m-top_medium">
                        <div class="slds-col slds-size_6-of-12">
                            <div class="summary-row"><span class="summary-label">{clientName} Current Total:</span><span class="summary-value">{formattedNetTotalClient}</span></div>
                            <div class="summary-row" style="color: var(--brand-primary);"><span class="summary-label">Equalizer Payment:</span><span class="summary-value">{formattedEqualizerClient}</span></div>
                            <div class="summary-row"><span class="summary-label">Resulting Total:</span><span class="summary-value">{formattedResultingClient}</span></div>
                        </div>
                        <div class="slds-col slds-size_6-of-12">
                            <div class="summary-row"><span class="summary-label">{opposingName} Current Total:</span><span class="summary-value">{formattedNetTotalOpposing}</span></div>
                            <div class="summary-row" style="color: var(--brand-primary);"><span class="summary-label">Equalizer Payment:</span><span class="summary-value">{formattedEqualizerOpposing}</span></div>
                            <div class="summary-row"><span class="summary-label">Resulting Total:</span><span class="summary-value">{formattedResultingOpposing}</span></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <template if:true={isDeleteModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <header class="slds-modal__header"><h2 class="slds-text-heading_medium slds-hyphenate">Confirm Delete</h2></header>
                    <div class="slds-modal__content slds-p-around_medium"><p class="slds-text-align_center">Are you sure you want to delete this record?</p></div>
                    <footer class="slds-modal__footer"><button class="slds-button slds-button_neutral" onclick={closeDeleteModal}>Cancel</button><button class="slds-button slds-button_destructive" onclick={confirmDelete}>Delete</button></footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
